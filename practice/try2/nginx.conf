events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server server1:8000;
        server server2:8000;
    }

    server {
        listen 8000;

        location / {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}